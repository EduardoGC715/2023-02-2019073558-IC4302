apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.spacyentity.name }}
  labels:
    app: {{ .Values.config.spacyentity.name }}
spec:
  replicas: {{ .Values.config.spacyentity.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.spacyentity.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.spacyentity.name }}
    spec:
      containers:
      - name: {{ .Values.config.spacyentity.name }}
        image: {{ .Values.config.spacyentity.image }}
        env:
          - name: RABBITMQ
            value: "stateful-rabbitmq"
          - name: SPACY_QUEUE
            value: {{ .Values.config.spacyentity.spacy_queue}}
          - name: RABBITPASS
            valueFrom:
              secretKeyRef:
                name: stateful-rabbitmq
                key: rabbitmq-password
                optional: false
          - name: ESENDPOINT
            value: ic4302-es-http
          - name: ESPASSWORD
            valueFrom:
              secretKeyRef:
                name: ic4302-es-elastic-user
                key: elastic
                optional: false
          - name: ESINDEX
            value: raw
          - name: AUGMENTEDINDEX
            value: augmented