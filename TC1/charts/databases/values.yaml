mariadb:
  enabled: true
  architecture: replication
  primary:
    resources:
      limits:
        cpu: "1"
        memory: "4Gi"
  secondary:
    replicaCount: 2
    resources:
      limits:
        cpu: "0.5"
        memory: "2Gi"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: "monitoring"
elasticsearch:
  enabled: false
  replicas: 1
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
      namespace: "monitoring"
  data:
    replicaCount: 1
  coordinating:
    replicaCount: 1
  ingest:
    replicaCount: 1
  master:
    replicaCount: 1
mongodb:
  enabled: false
  metrics:
    enabled: false
    serviceMonitor:
      enabled: true
      namespace: monitoring
mongodb: 
  enabled: false
  global:
    namespaceOverride: mongodb
  architecture: replicaset
  replicaCount: 3
  resources: 
    limits: 
      cpu: "0.6"
      memory: "2Gi"
  metrics: 
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
postgresql-ha:
  enabled: false
  postgresql:
    replicaCount: 1
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
      namespace: "monitoring"
mariadbgal:
  enabled: false
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
      namespace: "monitoring"