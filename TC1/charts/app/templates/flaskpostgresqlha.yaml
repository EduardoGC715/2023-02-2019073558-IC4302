{{- if .Values.config.postgresqlha.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.postgresqlha.name }}
  labels:
    app: {{ .Values.config.postgresqlha.name }}
spec:
  replicas: {{ .Values.config.postgresqlha.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.postgresqlha.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.postgresqlha.name }}
    spec:
      containers:
      - name: {{ .Values.config.postgresqlha.name }}
        image: {{ .Values.config.postgresqlha.image }}
        ports:
          - containerPort: 5000
        env:
          - name: PG_USER
            value: "postgres"
          - name: PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: databases-postgresql-ha-postgresql
                key: password
          - name: PG_HOST
            value: databases-postgresql-ha-pgpool
          - name: PG_DATABASE
            value: "pokemon"
---
apiVersion: v1
kind: Service
metadata:
  name: flaskportpgha
  namespace: default
  labels:
    app: {{ .Values.config.postgresqlha.name }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.config.postgresqlha.name }}
  ports:
    - name: http
      protocol: "TCP"
      port: 5000
      targetPort: 5000
      nodePort: 30094
---
apiVersion: v1
kind: Service
metadata:
  name: flaskservice
  namespace: default
  annotations:
    prometheus.io/port: "metrics"
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/part-of: dms
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.config.postgresqlha.name }}
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: "metrics"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flaskservicemonitor
  namespace: monitoring
spec:
  endpoints:
    - interval: 10s
      port: metrics
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app.kubernetes.io/part-of: dms
{{- end }}