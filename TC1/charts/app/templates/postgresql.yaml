{{- if .Values.config.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.postgresql.name }}
  labels:
    app: {{ .Values.config.postgresql.name }}
spec:
  replicas: {{ .Values.config.postgresql.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.postgresql.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.postgresql.name }}
    spec:
      containers:
      - name: {{ .Values.config.postgresql.name }}
        image: {{ .Values.config.postgresql.image }}
        ports:
          - name: "flask"
            containerPort: 5000
          - name: "metrics"
            containerPort: 8000
        env:
          - name: PGDATABASE
            value: {{ .Values.config.postgresql.database }}
          - name: PGUSER
            value: {{ .Values.config.postgresql.user }}
          - name: PGPASSWORD
            value: {{ .Values.config.postgresql.password }}
          - name: PGSERVICE
            value: {{ .Values.config.postgresql.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: flaskport
  namespace: default
  labels:
    app: {{ .Values.config.postgresql.name }}
spec:
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30090
  selector:
    app: {{ .Values.config.postgresql.name }}
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: flaskservice
  namespace: default
  annotations:
    prometheus.io/port: "metrics"
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/part-of: dms
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.config.postgresql.name }}
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: "metrics"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flaskservicemonitor
  namespace: monitoring
spec:
  endpoints:
    - interval: 10s
      port: metrics
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app.kubernetes.io/part-of: dms
{{- end }}