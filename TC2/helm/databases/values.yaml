mongodb:
  enabled: false
mariadb:
  enabled: true
elasticsearch:
  enabled: true
  elastic:
    version: 8.6.1
    replicas: 1
    name: ic4302
  kibana:
    version: 8.6.1
    replicas: 1
    name: ic4302
postgresql:
  enabled: false
  image:
    tag: 14.9.0
  primary:
    resources:
      limits:
        cpu: "1"
        memory: "4Gi"
  auth:
    database: "Pokemon"
    username: "admin"
    password: "admin"

neo4j:
  neo4j:
    name: my-standalone
    resources:
      cpu: "0.5"
      memory: "2Gi"

    # Uncomment to set the initial password
    #password: "my-initial-password"

    # Uncomment to use enterprise edition
    #edition: "enterprise"
    #acceptLicenseAgreement: "yes"

  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        requests:
          storage: 2Gi
neo4j:
  enabled: false
couchdb:
  enabled: false