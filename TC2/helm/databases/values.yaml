mongodb:
  enabled: false
mariadb:
  enabled: false
elasticsearch:
  enabled: false
  elastic:
    version: 8.6.1
    replicas: 1
    name: ic4302
  kibana:
    version: 8.6.1
    replicas: 1
    name: ic4302
postgresql:
  enabled: false
  image:
    tag: 14.9.0
  primary:
    resources:
      limits:
        cpu: "1"
        memory: "4Gi"
  auth:
    database: "Pokemon"
    username: "admin"
    password: "admin"
couchdb:
  enabled: false
  clusterSize: 1
  resources:
    limits:
      cpu: "1"
      memory: "4Gi"
  couchdbConfig:
    couchdb:
      uuid: $(shell curl -s https://www.uuidgenerator.net/api/version4 2>/dev/null | tr -d -)
neo4j:
  enabled: true
  neo4j:
    name: my-standalone
    resources:
      cpu: "0.5"
      memory: "2Gi"
    password: "neo4j-password"

  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        requests:
          storage: 2Gi