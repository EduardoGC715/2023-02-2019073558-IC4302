        secret: 
          secretName: aws-credential
      containers:
        - image: public.ecr.aws/aws-cli/aws-cli
          name: neo4j-snapshotter
          env:
            - name: NEO4J_SERVICE
              value: "{{ .Values.neo4j.config.host }}"
            - name: BUCKET_NAME
              value: "{{ .Values.neo4j.config.bucketName }}"
            - name: BACKUP_PATH
              value: "{{ .Values.neo4j.config.path }}"
            - name: MAX_BACKUPS
              value: "{{ .Values.neo4j.config.maxBackups }}"
            - name: NEO4J_PORT
              value: "{{ .Values.neo4j.config.port }}"
            - name: RESTORE_FILE
              value: "{{ .Values.neo4j.config.name }}"
          volumeMounts:
            - mountPath: "/neodump"
              name: neo4j-snapshotter
            - name: scripts
              mountPath: /scripts
            - name: aws-credential
              mountPath: /root/.aws
          command:
            - "/scripts/neo4jRestore.sh"
            # - "tail"
            # - "-f"
            # - "/dev/null"
      restartPolicy: Never
  backoffLimit: 1
{{- end }}
{{- end }}